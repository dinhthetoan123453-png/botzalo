services:
  - type: web
    name: zalo-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_PREFIX
        value: "!"
      - key: AUTO_REPLY_AI
        value: "false"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: AI_HISTORY_LIMIT
        value: "8"
      - key: GEMINI_API_KEY
        sync: false
      - key: ZALO_SESSION
        sync: false
